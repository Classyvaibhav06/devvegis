version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devvegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devvegis
      POSTGRES_PASSWORD: devvegis_password
      POSTGRES_DB: devvegis_db
    ports:
      - "5432:5432"
    volumes:
      - devvegis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devvegis -d devvegis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devvegis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devvegis_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devvegis_pgdata:
  devvegis_redisdata:
